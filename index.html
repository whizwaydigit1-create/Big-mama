    <!-- Defensive fetch shim for iframe environments -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var storedFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return storedFetch || originalFetch;
            },
            set: function(fn) {
              storedFetch = fn;
            }
          });
        } catch (e) {
          // ignore if already configured
        }
      })();
    </script>
